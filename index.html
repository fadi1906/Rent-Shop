<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#5c94fc">
<title>Super Mario</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', monospace; touch-action: none; }
#game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; margin: auto; position: absolute; inset: 0; }

.overlay { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.85); }
.overlay.hidden { display: none; }

.menu-card { background: #111; border: 4px solid #fc9838; border-radius: 8px; padding: 40px 32px; text-align: center; max-width: 420px; width: 90%; box-shadow: 0 0 60px rgba(252,152,56,0.4); }
.menu-card h1 { font-size: 2.5rem; font-weight: 900; color: #fc9838; letter-spacing: 3px; margin-bottom: 6px; text-shadow: 3px 3px 0 #b56000; }
.menu-card .sub { color: #6b7a85; font-size: 0.85rem; letter-spacing: 3px; margin-bottom: 26px; text-transform: uppercase; }
.menu-card p { color: #98a5b0; font-size: 0.85rem; line-height: 1.7; margin-bottom: 20px; }
.play-btn { width: 100%; padding: 16px; background: #fc9838; border: none; border-radius: 6px; color: #000; font-size: 1.1rem; font-weight: 900; letter-spacing: 3px; cursor: pointer; box-shadow: 0 6px 0 #b56000; transition: transform 0.1s; font-family: inherit; }
.play-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #b56000; }
.controls { margin-top: 22px; color: #6b7a85; font-size: 0.75rem; line-height: 1.9; text-align: left; }
.controls kbd { background: #222; padding: 2px 8px; border-radius: 3px; color: #fc9838; font-family: monospace; border: 1px solid #444; }

.gameover-card { background: #111; border: 4px solid #ff3b30; border-radius: 8px; padding: 40px 32px; text-align: center; max-width: 420px; width: 90%; }
.gameover-card.win { border-color: #34c759; }
.gameover-card h2 { font-size: 2rem; font-weight: 900; color: #ff3b30; letter-spacing: 3px; margin-bottom: 4px; text-shadow: 3px 3px 0 #7a0000; }
.gameover-card.win h2 { color: #34c759; text-shadow: 3px 3px 0 #005500; }
.gameover-card .stats { color: #98a5b0; font-size: 0.95rem; line-height: 2; margin: 20px 0; }
.gameover-card .stats strong { color: #fc9838; font-size: 1.3rem; }

#touch-controls { position: fixed; inset: 0; z-index: 15; pointer-events: none; display: none; }
#touch-controls.active { display: block; }
.touch-btn { position: absolute; bottom: 24px; width: 80px; height: 80px; border-radius: 50%; background: rgba(255,255,255,0.12); border: 3px solid rgba(255,255,255,0.4); color: #fff; font-size: 2rem; font-weight: bold; display: flex; align-items: center; justify-content: center; pointer-events: auto; }
.touch-btn:active { background: rgba(252,152,56,0.5); border-color: #fc9838; }
.touch-btn.left { left: 20px; }
.touch-btn.right { left: 115px; }
.touch-btn.jump { right: 100px; bottom: 90px; background: rgba(52,199,89,0.3); border-color: rgba(52,199,89,0.7); font-size: 1.1rem; }
.touch-btn.run { right: 20px; background: rgba(255,59,48,0.3); border-color: rgba(255,59,48,0.7); font-size: 1.1rem; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="touch-controls">
  <div class="touch-btn left" id="btn-left">◀</div>
  <div class="touch-btn right" id="btn-right">▶</div>
  <div class="touch-btn jump" id="btn-jump">JUMP</div>
  <div class="touch-btn run" id="btn-run">RUN</div>
</div>

<div class="overlay" id="menu">
  <div class="menu-card">
    <h1>SUPER MARIO</h1>
    <div class="sub">3 Level Adventure</div>
    <p>Collect coins, stomp enemies, find power-ups, and reach the flag!</p>
    <button class="play-btn" id="play-btn">START GAME</button>
    <div class="controls">
      <div>← → or A D : Move</div>
      <div>SPACE or W or ↑ : Jump</div>
      <div>SHIFT : Run</div>
      <div>P : Pause</div>
    </div>
  </div>
</div>

<div class="overlay hidden" id="gameover">
  <div class="gameover-card" id="gameover-card">
    <h2 id="gameover-title">GAME OVER</h2>
    <div class="stats" id="gameover-stats"></div>
    <button class="play-btn" id="restart-btn">PLAY AGAIN</button>
  </div>
</div>

<script>
// ============================================================
// SETUP
// ============================================================
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;

const TILE = 32;
const W = 960;
const H = 480;
canvas.width = W;
canvas.height = H;

function resize() {
  const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = (W * scale) + 'px';
  canvas.style.height = (H * scale) + 'px';
  canvas.style.left = ((window.innerWidth - W * scale) / 2) + 'px';
  canvas.style.top = ((window.innerHeight - H * scale) / 2) + 'px';
}
window.addEventListener('resize', resize);
resize();

const isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
if (isTouch) document.getElementById('touch-controls').classList.add('active');

// ============================================================
// AUDIO (synthesized)
// ============================================================
let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playSound(type) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const tone = (freq, dur, wave = 'square', vol = 0.08, startOffset = 0) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.setValueAtTime(freq, t + startOffset);
    o.type = wave;
    g.gain.setValueAtTime(vol, t + startOffset);
    g.gain.exponentialRampToValueAtTime(0.001, t + startOffset + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t + startOffset);
    o.stop(t + startOffset + dur);
  };
  const sweep = (f1, f2, dur, wave = 'square', vol = 0.08) => {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    o.type = wave;
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g).connect(audioCtx.destination);
    o.start(t); o.stop(t + dur);
  };

  switch (type) {
    case 'jump': sweep(380, 700, 0.13, 'square', 0.06); break;
    case 'coin': tone(988, 0.08, 'square', 0.08); tone(1318, 0.25, 'square', 0.08, 0.08); break;
    case 'stomp': sweep(300, 100, 0.1, 'square', 0.08); break;
    case 'brick': sweep(200, 60, 0.12, 'sawtooth', 0.1); break;
    case 'powerup': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.1, 'square', 0.07, i * 0.06)); break;
    case 'powerdown': [1047, 784, 659, 523].forEach((f, i) => tone(f, 0.08, 'square', 0.07, i * 0.05)); break;
    case 'death': [660, 580, 500, 420, 340, 260].forEach((f, i) => tone(f, 0.15, 'square', 0.09, i * 0.1)); break;
    case 'fireball': sweep(500, 200, 0.1, 'sawtooth', 0.05); break;
    case 'complete': [523, 659, 784, 1047, 1318].forEach((f, i) => tone(f, 0.15, 'square', 0.07, i * 0.12)); break;
    case 'bump': tone(150, 0.08, 'square', 0.08); break;
    case '1up': [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.1, 'triangle', 0.08, i * 0.07)); break;
  }
}

// ============================================================
// LEVEL DATA
// ============================================================
const LEVEL_H = 15;
const TILE_PROPS = {
  '#': { solid: true },
  'B': { solid: true, type: 'brick' },
  '?': { solid: true, type: 'question' },
  'U': { solid: true, type: 'used' },
  'P': { solid: true, type: 'pipe' },
  'C': { solid: false, type: 'coin' },
  'F': { solid: false, type: 'flag' },
  '|': { solid: false, type: 'pole' }
};

function isSolid(c) { return TILE_PROPS[c] && TILE_PROPS[c].solid; }

function makeLevel(width) {
  const g = [];
  for (let y = 0; y < LEVEL_H; y++) g.push(new Array(width).fill(' '));
  return g;
}
function setT(g, x, y, c) { if (g[y] && g[y][x] !== undefined) g[y][x] = c; }
function fill(g, x, y, w, h, c) { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) setT(g, i, j, c); }

function buildLevel1() {
  const w = 200;
  const g = makeLevel(w);
  // ground segments with gaps
  fill(g, 0, 13, 70, 2, '#');
  fill(g, 73, 13, 40, 2, '#');
  fill(g, 116, 13, 84, 2, '#');

  // Early blocks
  setT(g, 16, 9, '?');
  setT(g, 20, 9, 'B'); setT(g, 21, 9, '?'); setT(g, 22, 9, 'B'); setT(g, 23, 9, '?');
  setT(g, 21, 5, '?');

  // Coins above
  for (let i = 0; i < 4; i++) setT(g, 18 + i, 5, 'C');

  // Pipe 1
  fill(g, 28, 11, 2, 2, 'P');
  // Pipe 2 (tall)
  fill(g, 40, 10, 2, 3, 'P');
  // Brick stairs
  for (let i = 0; i < 4; i++) fill(g, 48 + i, 12 - i, 1, 1 + i, 'B');
  for (let i = 0; i < 4; i++) fill(g, 55 - i, 9 + i, 1, 4 - i, 'B');

  // Floating bricks before gap
  fill(g, 64, 8, 4, 1, 'B');
  setT(g, 66, 5, '?');

  // After gap 1
  fill(g, 78, 10, 2, 3, 'P');
  setT(g, 85, 9, '?'); setT(g, 86, 9, 'B'); setT(g, 87, 9, '?');

  // Coins
  for (let i = 0; i < 5; i++) setT(g, 82 + i, 6, 'C');

  // Bricks platform
  fill(g, 90, 7, 6, 1, 'B');
  setT(g, 92, 4, '?');

  // After gap 2
  setT(g, 122, 9, 'B'); setT(g, 123, 9, '?'); setT(g, 124, 9, 'B');

  // Stairs to flag
  for (let i = 0; i < 8; i++) fill(g, 150 + i, 12 - i, 1, 1 + i, '#');
  for (let i = 0; i < 8; i++) fill(g, 158 + i, 5 + i, 1, 8 - i, '#');

  // Flagpole
  const flagX = 175;
  for (let y = 6; y < 13; y++) setT(g, flagX, y, '|');
  setT(g, flagX, 13, 'F');

  // Enemy spawns (G = goomba, K = koopa)
  [22, 34, 45, 62, 80, 92, 110, 130, 145].forEach(x => setT(g, x, 12, 'G'));
  [52, 88, 118].forEach(x => setT(g, x, 12, 'K'));

  return { grid: g, width: w, flagX };
}

function buildLevel2() {
  const w = 220;
  const g = makeLevel(w);
  fill(g, 0, 13, 45, 2, '#');
  fill(g, 48, 13, 30, 2, '#');
  fill(g, 82, 13, 25, 2, '#');
  fill(g, 112, 13, 40, 2, '#');
  fill(g, 156, 13, 64, 2, '#');

  // Start blocks
  setT(g, 10, 9, '?');
  fill(g, 15, 9, 3, 1, 'B');
  setT(g, 16, 9, '?');
  setT(g, 16, 5, '?');

  // Coins
  for (let i = 0; i < 3; i++) setT(g, 14 + i, 6, 'C');

  // Pipes
  fill(g, 20, 11, 2, 2, 'P');
  fill(g, 28, 10, 2, 3, 'P');
  fill(g, 36, 9, 2, 4, 'P');

  // Platforms after gap
  fill(g, 50, 10, 4, 1, 'B');
  setT(g, 52, 7, '?');
  fill(g, 55, 8, 3, 1, 'B');

  // After gap 2
  for (let i = 0; i < 5; i++) fill(g, 84 + i, 12 - i, 1, 1 + i, '#');
  for (let i = 0; i < 5; i++) fill(g, 91 + i, 8 + i, 1, 5 - i, '#');

  // Floating platform
  fill(g, 100, 7, 8, 1, 'B');
  setT(g, 103, 4, '?');
  for (let i = 0; i < 4; i++) setT(g, 102 + i, 3, 'C');

  // After gap 3
  fill(g, 115, 10, 2, 3, 'P');
  fill(g, 125, 9, 3, 1, 'B');
  setT(g, 126, 9, '?');

  // Big climb
  for (let i = 0; i < 6; i++) fill(g, 140 + i, 12 - i, 1, 1 + i, '#');

  // After gap 4
  setT(g, 160, 9, '?'); setT(g, 161, 9, 'B'); setT(g, 162, 9, '?');
  fill(g, 168, 7, 5, 1, 'B');
  for (let i = 0; i < 3; i++) setT(g, 169 + i, 4, 'C');

  // Final stairs
  for (let i = 0; i < 8; i++) fill(g, 185 + i, 12 - i, 1, 1 + i, '#');
  for (let i = 0; i < 8; i++) fill(g, 193 + i, 5 + i, 1, 8 - i, '#');

  const flagX = 210;
  for (let y = 6; y < 13; y++) setT(g, flagX, y, '|');
  setT(g, flagX, 13, 'F');

  [15, 30, 40, 60, 70, 90, 105, 120, 135, 150, 175].forEach(x => setT(g, x, 12, 'G'));
  [25, 55, 100, 130].forEach(x => setT(g, x, 12, 'K'));

  return { grid: g, width: w, flagX };
}

function buildLevel3() {
  const w = 240;
  const g = makeLevel(w);
  fill(g, 0, 13, 30, 2, '#');
  fill(g, 34, 13, 20, 2, '#');
  fill(g, 58, 13, 15, 2, '#');
  fill(g, 77, 13, 15, 2, '#');
  fill(g, 96, 13, 20, 2, '#');
  fill(g, 120, 13, 15, 2, '#');
  fill(g, 139, 13, 20, 2, '#');
  fill(g, 163, 13, 77, 2, '#');

  // Block gauntlet
  setT(g, 8, 9, '?');
  fill(g, 12, 9, 5, 1, 'B');
  setT(g, 14, 9, '?');
  setT(g, 14, 5, '?');

  // Gap 1 - short platform
  fill(g, 30, 11, 4, 1, 'B');
  setT(g, 32, 8, '?');

  // Gap 2 - stairs over gap
  fill(g, 50, 10, 2, 1, 'B');
  fill(g, 53, 8, 2, 1, 'B');

  // Gap 3 - tight jumps
  fill(g, 70, 10, 2, 1, 'B');
  fill(g, 73, 11, 4, 1, 'B');

  // Gap 4
  fill(g, 92, 9, 4, 1, 'B');

  // Big platform after
  fill(g, 100, 7, 8, 1, 'B');
  setT(g, 103, 4, '?');
  for (let i = 0; i < 4; i++) setT(g, 102 + i, 3, 'C');

  // Gap 5
  fill(g, 116, 10, 4, 1, 'B');

  // Gap 6
  fill(g, 135, 11, 4, 1, 'B');

  // Final stretch
  for (let i = 0; i < 6; i++) fill(g, 168 + i, 12 - i, 1, 1 + i, '#');
  for (let i = 0; i < 6; i++) fill(g, 176 + i, 7 + i, 1, 6 - i, '#');

  setT(g, 190, 9, '?'); setT(g, 191, 9, 'B'); setT(g, 192, 9, '?');
  fill(g, 200, 7, 6, 1, 'B');

  // Stairs
  for (let i = 0; i < 8; i++) fill(g, 215 + i, 12 - i, 1, 1 + i, '#');
  for (let i = 0; i < 8; i++) fill(g, 223 + i, 5 + i, 1, 8 - i, '#');

  const flagX = 233;
  for (let y = 6; y < 13; y++) setT(g, flagX, y, '|');
  setT(g, flagX, 13, 'F');

  [12, 25, 40, 52, 68, 80, 95, 108, 125, 140, 155, 172, 185, 200].forEach(x => setT(g, x, 12, 'G'));
  [20, 45, 62, 85, 118, 148, 195].forEach(x => setT(g, x, 12, 'K'));

  return { grid: g, width: w, flagX };
}

const LEVELS = [buildLevel1, buildLevel2, buildLevel3];

// ============================================================
// GAME STATE
// ============================================================
let game = null;

function newGame(levelIdx = 0, carryState = null) {
  const lvlData = LEVELS[levelIdx]();
  const grid = lvlData.grid;
  const width = lvlData.width;

  game = {
    state: 'playing',
    level: levelIdx,
    levelGrid: grid,
    levelWidth: width,
    flagX: lvlData.flagX,
    camera: { x: 0 },
    player: {
      x: 100, y: 100,
      w: 20, h: 30,
      vx: 0, vy: 0,
      facing: 1,
      grounded: false,
      big: carryState?.big || false,
      fire: carryState?.fire || false,
      invuln: 0,
      walkFrame: 0,
      alive: true,
      coyote: 0,
      jumpBuffer: 0,
      jumpHeld: false
    },
    enemies: [],
    items: [],
    projectiles: [],
    particles: [],
    coinPopups: [],
    score: carryState?.score || 0,
    coins: carryState?.coins || 0,
    lives: carryState?.lives || 3,
    time: 300,
    timeAccum: 0,
    keys: {},
    flagReached: false,
    flagAnim: 0,
    deathTimer: 0,
    levelCompleteTimer: 0
  };

  // Extract enemy spawns
  for (let y = 0; y < LEVEL_H; y++) {
    for (let x = 0; x < width; x++) {
      const c = grid[y][x];
      if (c === 'G') {
        game.enemies.push(makeGoomba(x * TILE, y * TILE));
        grid[y][x] = ' ';
      } else if (c === 'K') {
        game.enemies.push(makeKoopa(x * TILE, y * TILE));
        grid[y][x] = ' ';
      }
    }
  }

  // Find player spawn (leftmost ground column with open space above)
  for (let x = 0; x < width; x++) {
    if (grid[13][x] === '#' && grid[12][x] === ' ' && grid[11][x] === ' ') {
      game.player.x = x * TILE + 6;
      game.player.y = 12 * TILE;
      break;
    }
  }
  game.player.y = 12 * TILE - (game.player.big ? 24 : 0);

  if (game.player.big) { game.player.h = 54; game.player.y -= 24; }

  return game;
}

function makeGoomba(x, y) {
  return {
    type: 'goomba',
    x: x + 4, y: y + 8,
    w: 24, h: 24,
    vx: -60, vy: 0,
    facing: -1,
    alive: true,
    grounded: false,
    squishTimer: 0
  };
}
function makeKoopa(x, y) {
  return {
    type: 'koopa',
    x: x + 4, y: y + 2,
    w: 24, h: 30,
    vx: -60, vy: 0,
    facing: -1,
    alive: true,
    grounded: false,
    shell: false,
    shellTimer: 0,
    sliding: false
  };
}

// ============================================================
// PHYSICS / COLLISION
// ============================================================
const GRAVITY = 2200;
const JUMP_V = -720;
const MOVE_ACCEL = 1500;
const MAX_WALK = 190;
const MAX_RUN = 320;
const FRICTION = 0.8;
const AIR_FRICTION = 0.95;
const MAX_FALL = 900;

function solidTilesIn(x, y, w, h) {
  const tiles = [];
  const x1 = Math.floor(x / TILE);
  const x2 = Math.floor((x + w - 1) / TILE);
  const y1 = Math.floor(y / TILE);
  const y2 = Math.floor((y + h - 1) / TILE);
  for (let ty = y1; ty <= y2; ty++) {
    for (let tx = x1; tx <= x2; tx++) {
      if (ty < 0 || ty >= LEVEL_H) continue;
      if (tx < 0 || tx >= game.levelWidth) continue;
      const c = game.levelGrid[ty][tx];
      if (isSolid(c)) tiles.push({ tx, ty, x: tx * TILE, y: ty * TILE, c });
    }
  }
  return tiles;
}

function moveEntity(e, dt, isPlayer) {
  // Horizontal
  e.x += e.vx * dt;
  let tiles = solidTilesIn(e.x, e.y, e.w, e.h);
  if (tiles.length > 0) {
    if (e.vx > 0) {
      let minX = Infinity;
      for (const t of tiles) minX = Math.min(minX, t.x);
      e.x = minX - e.w;
    } else if (e.vx < 0) {
      let maxX = -Infinity;
      for (const t of tiles) maxX = Math.max(maxX, t.x + TILE);
      e.x = maxX;
    }
    e.vx = 0;
  }

  // Vertical
  e.y += e.vy * dt;
  e.grounded = false;
  tiles = solidTilesIn(e.x, e.y, e.w, e.h);
  for (const t of tiles) {
    if (e.vy > 0) {
      e.y = t.y - e.h;
      e.vy = 0;
      e.grounded = true;
    } else if (e.vy < 0) {
      e.y = t.y + TILE;
      e.vy = 0;
      if (isPlayer) hitBlock(t.tx, t.ty);
    }
  }
}

function hitBlock(tx, ty) {
  const c = game.levelGrid[ty][tx];
  const p = game.player;
  if (c === '?' || c === 'B') {
    if (c === '?') {
      game.levelGrid[ty][tx] = 'U';
      playSound('powerup');
      // Spawn mushroom or coin
      if (Math.random() < 0.4) {
        game.items.push({
          type: 'mushroom',
          x: tx * TILE + 4, y: ty * TILE - 28,
          w: 24, h: 24,
          vx: 60, vy: 0,
          grounded: false,
          alive: true
        });
      } else {
        game.coins++;
        game.score += 200;
        game.coinPopups.push({ x: tx * TILE + 16, y: ty * TILE, vy: -200, life: 0.6 });
        playSound('coin');
      }
    } else if (c === 'B') {
      if (p.big) {
        game.levelGrid[ty][tx] = ' ';
        playSound('brick');
        game.score += 50;
        // Particles
        for (let i = 0; i < 8; i++) {
          game.particles.push({
            x: tx * TILE + 16, y: ty * TILE + 16,
            vx: (Math.random() - 0.5) * 400,
            vy: -200 - Math.random() * 300,
            life: 0.8, maxLife: 0.8,
            color: '#b5451a', size: 5
          });
        }
      } else {
        playSound('bump');
      }
    }
  } else {
    playSound('bump');
  }
}

// ============================================================
// INPUT
// ============================================================
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (game) game.keys[k] = true;
  if (k === 'p' && game && (game.state === 'playing' || game.state === 'paused')) {
    game.state = game.state === 'playing' ? 'paused' : 'playing';
  }
  if ([' ', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }
});
window.addEventListener('keyup', e => {
  if (game) game.keys[e.key.toLowerCase()] = false;
});

// Touch controls
const touch = { left: false, right: false, jump: false, run: false };
function bindTouch(id, key) {
  const el = document.getElementById(id);
  if (!el) return;
  const on = (e) => { e.preventDefault(); initAudio(); touch[key] = true; };
  const off = (e) => { e.preventDefault(); touch[key] = false; };
  el.addEventListener('touchstart', on, { passive: false });
  el.addEventListener('touchend', off, { passive: false });
  el.addEventListener('touchcancel', off, { passive: false });
}
bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');
bindTouch('btn-jump', 'jump');
bindTouch('btn-run', 'run');

// ============================================================
// UPDATE
// ============================================================
function update(dt) {
  if (!game) return;
  if (game.state === 'paused') return;
  if (game.state === 'dead') {
    game.deathTimer -= dt;
    game.player.vy += GRAVITY * dt;
    game.player.y += game.player.vy * dt;
    if (game.deathTimer <= 0) {
      if (game.lives > 0) {
        newGame(game.level, { big: false, fire: false, score: game.score, coins: game.coins, lives: game.lives - 1 });
      } else {
        showGameOver(false);
      }
    }
    return;
  }
  if (game.state === 'complete') {
    game.levelCompleteTimer += dt;
    game.flagAnim += dt;
    if (game.flagAnim > 2 && game.levelCompleteTimer > 2.5) {
      // Next level or win
      if (game.level < LEVELS.length - 1) {
        newGame(game.level + 1, {
          big: game.player.big,
          fire: game.player.fire,
          score: game.score,
          coins: game.coins,
          lives: game.lives
        });
      } else {
        showGameOver(true);
      }
    }
    return;
  }

  // Timer
  game.timeAccum += dt;
  if (game.timeAccum >= 1) {
    game.timeAccum -= 1;
    game.time -= 1;
    if (game.time <= 0) {
      killPlayer();
      return;
    }
  }

  // ===== Player =====
  const p = game.player;
  if (!p.alive) return;

  // Input
  const keys = game.keys;
  let left = keys['arrowleft'] || keys['a'] || touch.left;
  let right = keys['arrowright'] || keys['d'] || touch.right;
  let jump = keys[' '] || keys['arrowup'] || keys['w'] || touch.jump;
  let run = keys['shift'] || touch.run;

  // Horizontal movement
  const maxSpeed = run ? MAX_RUN : MAX_WALK;
  if (left && !right) {
    p.vx -= MOVE_ACCEL * dt;
    if (p.vx < -maxSpeed) p.vx = -maxSpeed;
    p.facing = -1;
  } else if (right && !left) {
    p.vx += MOVE_ACCEL * dt;
    if (p.vx > maxSpeed) p.vx = maxSpeed;
    p.facing = 1;
  } else {
    if (p.grounded) p.vx *= FRICTION;
    else p.vx *= AIR_FRICTION;
    if (Math.abs(p.vx) < 10) p.vx = 0;
  }

  // Jump
  if (p.grounded) p.coyote = 0.1;
  else p.coyote = Math.max(0, p.coyote - dt);

  if (jump && !p.jumpHeld) {
    p.jumpBuffer = 0.12;
    p.jumpHeld = true;
  }
  if (!jump) p.jumpHeld = false;

  if (p.jumpBuffer > 0) {
    p.jumpBuffer -= dt;
    if (p.coyote > 0) {
      p.vy = JUMP_V;
      p.coyote = 0;
      p.jumpBuffer = 0;
      p.grounded = false;
      playSound('jump');
    }
  }
  // Variable jump height - release early = shorter jump
  if (!jump && p.vy < -200) {
    p.vy = -200;
  }

  // Gravity
  p.vy += GRAVITY * dt;
  if (p.vy > MAX_FALL) p.vy = MAX_FALL;

  // Move
  moveEntity(p, dt, true);

  // Walk animation
  if (Math.abs(p.vx) > 10 && p.grounded) {
    p.walkFrame += dt * Math.abs(p.vx) * 0.05;
  } else if (p.grounded) {
    p.walkFrame = 0;
  }

  // Invulnerability
  if (p.invuln > 0) p.invuln -= dt;

  // Fall off world
  if (p.y > H + 100) {
    killPlayer();
    return;
  }

  // Camera follow
  const targetCam = p.x - W * 0.4;
  game.camera.x += (targetCam - game.camera.x) * Math.min(1, dt * 8);
  const maxCam = (game.levelWidth * TILE) - W;
  game.camera.x = Math.max(0, Math.min(maxCam, game.camera.x));

  // Flag check
  if (p.x > game.flagX * TILE - 20 && !game.flagReached) {
    game.flagReached = true;
    game.state = 'complete';
    game.flagAnim = 0;
    game.levelCompleteTimer = 0;
    game.score += Math.floor(game.time) * 10 + 500;
    playSound('complete');
    return;
  }

  // ===== Enemies =====
  for (const e of game.enemies) {
    if (!e.alive) continue;
    if (e.squishTimer > 0) { e.squishTimer -= dt; if (e.squishTimer <= 0) e.alive = false; continue; }

    // Gravity
    e.vy += GRAVITY * dt;
    if (e.vy > MAX_FALL) e.vy = MAX_FALL;

    // Move
    moveEntity(e, dt, false);

    // Turn at wall
    if (e.vx === 0 && !e.sliding) {
      e.vx = e.facing * 60;
      e.facing *= -1;
    }

    // Koopa shell check
    if (e.type === 'koopa' && e.shell) {
      if (e.sliding) {
        e.vx = e.facing * 400;
        e.shellTimer -= dt;
        if (e.shellTimer <= 0) {
          // Wake up
          e.shell = false;
          e.sliding = false;
          e.h = 30;
          e.y -= 10;
          e.vx = -60;
          e.facing = -1;
        }
      }
    }

    // Fall off
    if (e.y > H + 100) { e.alive = false; continue; }

    // Off-screen far
    if (e.x < game.camera.x - 400 || e.x > game.camera.x + W + 600) continue;

    // Collision with player
    if (p.alive && !p.invuln && rectOverlap(p, e)) {
      // Stomp check
      if (p.vy > 0 && p.y + p.h - e.y < 20) {
        stompEnemy(e);
      } else {
        // Player hit
        if (p.fire) {
          // Fire mario takes damage → back to big
          p.fire = false;
          p.invuln = 1.5;
          playSound('powerdown');
        } else if (p.big) {
          p.big = false;
          p.h = 30;
          p.y += 24;
          p.invuln = 1.5;
          playSound('powerdown');
        } else {
          killPlayer();
          return;
        }
      }
    }

    // Koopa shell hitting other enemies
    if (e.type === 'koopa' && e.shell && e.sliding) {
      for (const o of game.enemies) {
        if (o === e || !o.alive) continue;
        if (rectOverlap(e, o)) {
          o.alive = false;
          game.score += 100;
          playSound('stomp');
          // Points popup
          game.coinPopups.push({ x: o.x + 12, y: o.y, vy: -200, life: 0.6, text: '+100' });
        }
      }
    }
  }

  // ===== Items =====
  for (const it of game.items) {
    if (!it.alive) continue;
    it.vy += GRAVITY * dt;
    if (it.vy > MAX_FALL) it.vy = MAX_FALL;
    moveEntity(it, dt, false);

    if (it.y > H + 100) { it.alive = false; continue; }

    // Collect
    if (rectOverlap(p, it)) {
      it.alive = false;
      if (it.type === 'mushroom') {
        if (!p.big) {
          p.big = true;
          p.h = 54;
          p.y -= 24;
        }
        game.score += 1000;
        playSound('powerup');
      }
      game.coinPopups.push({ x: it.x + 12, y: it.y, vy: -200, life: 0.6, text: '+1000' });
    }
  }

  // ===== Projectiles (fireballs) =====
  for (const pr of game.projectiles) {
    pr.vy += GRAVITY * dt;
    pr.x += pr.vx * dt;
    pr.y += pr.vy * dt;
    pr.life -= dt;

    // Bounce off ground
    const tiles = solidTilesIn(pr.x - 6, pr.y - 6, 12, 12);
    for (const t of tiles) {
      if (pr.vy > 0) { pr.y = t.y - 6; pr.vy = -400; }
      else if (pr.vy < 0) { pr.y = t.y + TILE + 6; pr.vy = 200; }
    }

    // Hit enemies
    for (const e of game.enemies) {
      if (!e.alive) continue;
      if (pr.x > e.x && pr.x < e.x + e.w && pr.y > e.y && pr.y < e.y + e.h) {
        e.alive = false;
        pr.life = 0;
        game.score += 200;
        playSound('stomp');
        for (let i = 0; i < 8; i++) {
          game.particles.push({
            x: e.x + 12, y: e.y + 12,
            vx: (Math.random() - 0.5) * 300,
            vy: (Math.random() - 0.5) * 300 - 100,
            life: 0.5, maxLife: 0.5,
            color: '#ff6b00', size: 4
          });
        }
        break;
      }
    }

    if (pr.life <= 0 || pr.x < 0 || pr.x > game.levelWidth * TILE) pr.life = 0;
  }
  game.projectiles = game.projectiles.filter(p => p.life > 0);

  // Fireball shoot
  if (p.fire && (game.keys['x'] || (isTouch && false)) && !game.fireCooldown) {
    game.fireCooldown = true;
    const fb = {
      x: p.x + (p.facing > 0 ? p.w : 0),
      y: p.y + p.h / 2,
      vx: p.facing * 500,
      vy: -100,
      life: 3
    };
    game.projectiles.push(fb);
    playSound('fireball');
    setTimeout(() => { game.fireCooldown = false; }, 300);
  }

  // ===== Particles =====
  for (const pt of game.particles) {
    pt.vy += GRAVITY * dt * 0.5;
    pt.x += pt.vx * dt;
    pt.y += pt.vy * dt;
    pt.life -= dt;
  }
  game.particles = game.particles.filter(p => p.life > 0);

  // ===== Coin popups =====
  for (const c of game.coinPopups) {
    c.y += c.vy * dt;
    c.vy += GRAVITY * dt * 0.3;
    c.life -= dt;
  }
  game.coinPopups = game.coinPopups.filter(c => c.life > 0);

  // ===== Coins in level =====
  // Check if player is over a coin tile
  const ptx = Math.floor((p.x + p.w / 2) / TILE);
  const pty = Math.floor((p.y + p.h / 2) / TILE);
  if (game.levelGrid[pty] && game.levelGrid[pty][ptx] === 'C') {
    game.levelGrid[pty][ptx] = ' ';
    game.coins++;
    game.score += 100;
    playSound('coin');
  }
}

function stompEnemy(e) {
  const p = game.player;
  p.vy = JUMP_V * 0.7;
  p.y = e.y - p.h;
  if (e.type === 'goomba') {
    e.squishTimer = 0.4;
    e.vx = 0;
    game.score += 100;
    playSound('stomp');
    game.coinPopups.push({ x: e.x + 12, y: e.y, vy: -200, life: 0.6, text: '+100' });
  } else if (e.type === 'koopa') {
    if (!e.shell) {
      e.shell = true;
      e.h = 20;
      e.y += 10;
      e.vx = 0;
      e.sliding = false;
      game.score += 100;
      playSound('stomp');
      game.coinPopups.push({ x: e.x + 12, y: e.y, vy: -200, life: 0.6, text: '+100' });
    } else if (e.sliding) {
      e.sliding = false;
      e.vx = 0;
      e.shellTimer = 0;
      playSound('stomp');
    } else {
      // Kick
      e.sliding = true;
      e.facing = p.facing;
      e.shellTimer = 5;
      playSound('stomp');
      game.score += 400;
      game.coinPopups.push({ x: e.x + 12, y: e.y, vy: -200, life: 0.6, text: '+400' });
    }
  }
}

function killPlayer() {
  if (game.state !== 'playing') return;
  game.state = 'dead';
  game.deathTimer = 2;
  game.player.vy = -600;
  game.player.alive = false;
  playSound('death');
}

function rectOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

// ============================================================
// DRAW
// ============================================================
function draw() {
  if (!game) return;

  // Sky gradient
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#5c94fc');
  sky.addColorStop(1, '#87ceeb');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Parallax hills
  drawHills();

  // Parallax clouds
  drawClouds();

  ctx.save();
  ctx.translate(-Math.floor(game.camera.x), 0);

  // Draw tiles
  const camX = game.camera.x;
  const startTx = Math.max(0, Math.floor(camX / TILE) - 1);
  const endTx = Math.min(game.levelWidth - 1, Math.floor((camX + W) / TILE) + 1);

  for (let ty = 0; ty < LEVEL_H; ty++) {
    for (let tx = startTx; tx <= endTx; tx++) {
      const c = game.levelGrid[ty][tx];
      if (c === ' ' || c === 'C') continue;
      drawTile(tx * TILE, ty * TILE, c, tx, ty);
    }
  }

  // Draw coins (animated)
  for (let ty = 0; ty < LEVEL_H; ty++) {
    for (let tx = startTx; tx <= endTx; tx++) {
      if (game.levelGrid[ty][tx] === 'C') {
        drawCoin(tx * TILE + 16, ty * TILE + 16);
      }
    }
  }

  // Draw items
  for (const it of game.items) {
    if (!it.alive) continue;
    if (it.type === 'mushroom') drawMushroom(it.x, it.y, it.w, it.h);
  }

  // Draw enemies
  for (const e of game.enemies) {
    if (!e.alive) continue;
    if (e.x < camX - 100 || e.x > camX + W + 100) continue;
    if (e.type === 'goomba') drawGoomba(e);
    else if (e.type === 'koopa') drawKoopa(e);
  }

  // Draw projectiles
  for (const pr of game.projectiles) {
    ctx.fillStyle = '#ff6b00';
    ctx.shadowColor = '#ff9500';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(pr.x, pr.y, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  // Draw player
  if (game.player.alive || game.state === 'dead') {
    drawMario(game.player);
  }

  // Draw particles
  for (const pt of game.particles) {
    ctx.globalAlpha = pt.life / pt.maxLife;
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - pt.size/2, pt.y - pt.size/2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;

  // Draw coin popups
  for (const c of game.coinPopups) {
    ctx.globalAlpha = Math.min(1, c.life * 2);
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.font = 'bold 16px monospace';
    ctx.textAlign = 'center';
    ctx.strokeText(c.text || '+100', c.x, c.y);
    ctx.fillText(c.text || '+100', c.x, c.y);
  }
  ctx.globalAlpha = 1;

  ctx.restore();

  // HUD
  drawHUD();

  // State overlays
  if (game.state === 'paused') {
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fc9838';
    ctx.font = 'bold 48px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W/2, H/2);
    ctx.font = 'bold 18px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('Press P to resume', W/2, H/2 + 40);
  }
}

function drawHills() {
  ctx.fillStyle = '#4a9d3f';
  const offset = -game.camera.x * 0.3 % 400;
  for (let i = -1; i < W / 400 + 1; i++) {
    const x = i * 400 + offset;
    ctx.beginPath();
    ctx.arc(x + 100, H - 60, 100, Math.PI, 0);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + 280, H - 60, 130, Math.PI, 0);
    ctx.fill();
  }
}

function drawClouds() {
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  const offset = -game.camera.x * 0.15 % 500;
  for (let i = -1; i < W / 500 + 1; i++) {
    const x = i * 500 + offset;
    drawCloud(x + 100, 80, 1);
    drawCloud(x + 320, 130, 0.8);
    drawCloud(x + 200, 40, 0.6);
  }
}
function drawCloud(x, y, scale) {
  ctx.beginPath();
  ctx.arc(x, y, 25 * scale, 0, Math.PI * 2);
  ctx.arc(x + 30 * scale, y - 5, 30 * scale, 0, Math.PI * 2);
  ctx.arc(x + 60 * scale, y, 25 * scale, 0, Math.PI * 2);
  ctx.fill();
}

function drawTile(x, y, c, tx, ty) {
  switch (c) {
    case '#': // ground
      ctx.fillStyle = '#c8823c';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#a06228';
      ctx.fillRect(x, y, TILE, 4);
      ctx.fillRect(x, y + TILE - 4, TILE, 4);
      // Dirt texture
      ctx.fillStyle = '#8a5020';
      ctx.fillRect(x + 6, y + 10, 4, 4);
      ctx.fillRect(x + 20, y + 18, 5, 5);
      ctx.fillRect(x + 12, y + 24, 4, 3);
      break;
    case 'B': // brick
      ctx.fillStyle = '#b5451a';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#8a3310';
      // Brick pattern
      ctx.fillRect(x, y, TILE, 2);
      ctx.fillRect(x, y + 15, TILE, 2);
      ctx.fillRect(x + 14, y, 2, 15);
      ctx.fillRect(x + 6, y + 15, 2, 17);
      ctx.fillRect(x + 22, y + 15, 2, 17);
      break;
    case '?': // question
      ctx.fillStyle = '#fc9838';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#c86f1a';
      ctx.fillRect(x, y, TILE, 3);
      ctx.fillRect(x, y + TILE - 3, TILE, 3);
      // ?
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('?', x + TILE/2, y + TILE/2 + 2);
      ctx.textBaseline = 'alphabetic';
      break;
    case 'U': // used
      ctx.fillStyle = '#8a5020';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#5c3310';
      ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
      break;
    case 'P': // pipe
      ctx.fillStyle = '#2a8a2a';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#1a6a1a';
      ctx.fillRect(x, y, 3, TILE);
      ctx.fillStyle = '#4ab84a';
      ctx.fillRect(x + 6, y, 4, TILE);
      break;
    case '|': // flag pole
      ctx.fillStyle = '#b0b0b0';
      ctx.fillRect(x + TILE/2 - 2, y, 4, TILE);
      break;
    case 'F': // flag goal
      ctx.fillStyle = '#b0b0b0';
      ctx.fillRect(x + TILE/2 - 2, y, 4, TILE);
      // Flag triangle
      ctx.fillStyle = '#ff3b30';
      ctx.beginPath();
      ctx.moveTo(x + TILE/2 + 2, y + 4);
      ctx.lineTo(x + TILE/2 + 2 + 24, y + 4 + 10);
      ctx.lineTo(x + TILE/2 + 2, y + 4 + 20);
      ctx.closePath();
      ctx.fill();
      break;
  }
}

function drawCoin(x, y) {
  const t = performance.now() / 150;
  const scaleX = Math.abs(Math.cos(t)) * 0.8 + 0.2;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scaleX, 1);
  ctx.fillStyle = '#fc9838';
  ctx.beginPath();
  ctx.arc(0, 0, 11, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#ffe066';
  ctx.beginPath();
  ctx.arc(0, 0, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#c86f1a';
  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('$', 0, 1);
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

function drawMushroom(x, y, w, h) {
  // Stem
  ctx.fillStyle = '#f8e8c8';
  ctx.fillRect(x + 4, y + h/2, w - 8, h/2);
  // Cap
  ctx.fillStyle = '#e84444';
  ctx.beginPath();
  ctx.arc(x + w/2, y + h/2, w/2, Math.PI, 0);
  ctx.fill();
  ctx.fillRect(x, y + h/2, w, h/4);
  // Spots
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(x + w/3, y + h/3, 4, 0, Math.PI * 2);
  ctx.arc(x + 2*w/3, y + h/3, 3, 0, Math.PI * 2);
  ctx.fill();
  // Eyes
  ctx.fillStyle = '#000';
  ctx.fillRect(x + w/2 - 6, y + h/2 + 2, 3, 5);
  ctx.fillRect(x + w/2 + 3, y + h/2 + 2, 3, 5);
}

function drawGoomba(e) {
  const x = e.x, y = e.y, w = e.w, h = e.h;
  if (e.squishTimer > 0) {
    // Squished
    ctx.fillStyle = '#8a4a1a';
    ctx.fillRect(x - 4, y + h - 8, w + 8, 8);
    return;
  }
  // Body
  ctx.fillStyle = '#8a4a1a';
  ctx.beginPath();
  ctx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
  ctx.fill();
  // Face
  ctx.fillStyle = '#f8e8c8';
  ctx.beginPath();
  ctx.ellipse(x + w/2, y + h/2 + 4, w/3, h/3, 0, 0, Math.PI * 2);
  ctx.fill();
  // Eyes
  ctx.fillStyle = '#000';
  ctx.fillRect(x + w/2 - 6, y + h/2 - 2, 3, 6);
  ctx.fillRect(x + w/2 + 3, y + h/2 - 2, 3, 6);
  // Angry eyebrows
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x + w/2 - 8, y + h/2 - 6);
  ctx.lineTo(x + w/2 - 2, y + h/2 - 3);
  ctx.moveTo(x + w/2 + 8, y + h/2 - 6);
  ctx.lineTo(x + w/2 + 2, y + h/2 - 3);
  ctx.stroke();
  // Feet
  ctx.fillStyle = '#3a1a05';
  ctx.fillRect(x + 2, y + h - 4, 8, 4);
  ctx.fillRect(x + w - 10, y + h - 4, 8, 4);
}

function drawKoopa(e) {
  const x = e.x, y = e.y, w = e.w, h = e.h;
  if (e.shell) {
    // Shell
    ctx.fillStyle = '#2a8a2a';
    ctx.beginPath();
    ctx.ellipse(x + w/2, y + h/2, w/2, h/2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a6a1a';
    ctx.beginPath();
    ctx.ellipse(x + w/2, y + h/2, w/2 - 4, h/2 - 4, 0, 0, Math.PI * 2);
    ctx.fill();
    // Shell pattern
    ctx.strokeStyle = '#4ab84a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x + w/2, y + h/2, w/3, 0, Math.PI * 2);
    ctx.stroke();
    return;
  }
  // Head
  ctx.fillStyle = '#a0d050';
  ctx.beginPath();
  ctx.ellipse(x + w/2 + (e.facing > 0 ? 5 : -5), y + 8, 12, 10, 0, 0, Math.PI * 2);
  ctx.fill();
  // Eye
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(x + w/2 + (e.facing > 0 ? 10 : -10), y + 6, 2, 0, Math.PI * 2);
  ctx.fill();
  // Shell
  ctx.fillStyle = '#2a8a2a';
  ctx.beginPath();
  ctx.ellipse(x + w/2, y + h/2 + 4, w/2, h/2 - 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#1a6a1a';
  ctx.beginPath();
  ctx.ellipse(x + w/2, y + h/2 + 4, w/2 - 3, h/2 - 7, 0, 0, Math.PI * 2);
  ctx.fill();
  // Feet
  ctx.fillStyle = '#e8c840';
  ctx.fillRect(x + 2, y + h - 4, 6, 4);
  ctx.fillRect(x + w - 8, y + h - 4, 6, 4);
}

function drawMario(p) {
  const x = Math.floor(p.x);
  const y = Math.floor(p.y);
  const w = p.w;
  const h = p.h;
  const facing = p.facing;

  // Invuln blink
  if (p.invuln > 0 && Math.floor(p.invuln * 15) % 2 === 0) return;

  ctx.save();
  ctx.translate(x + w/2, y);
  if (facing < 0) ctx.scale(-1, 1);
  ctx.translate(-w/2, 0);

  const hatColor = p.fire ? '#fff' : '#e84444';
  const shirtColor = p.fire ? '#e84444' : '#e84444';
  const overallColor = p.fire ? '#e84444' : '#2058c8';
  const skinColor = '#ffd8a8';
  const shoeColor = '#7a3800';

  if (p.big) {
    // Big Mario
    // Hat
    ctx.fillStyle = hatColor;
    ctx.fillRect(2, 0, w - 4, 8);
    ctx.fillRect(0, 6, w, 5);
    // Face
    ctx.fillStyle = skinColor;
    ctx.fillRect(4, 10, w - 8, 10);
    // Eye
    ctx.fillStyle = '#000';
    ctx.fillRect(w - 10, 12, 2, 4);
    // Mustache
    ctx.fillStyle = '#3a2000';
    ctx.fillRect(w - 12, 17, 8, 3);
    // Shirt
    ctx.fillStyle = shirtColor;
    ctx.fillRect(2, 20, w - 4, 12);
    // Overalls
    ctx.fillStyle = overallColor;
    ctx.fillRect(4, 26, w - 8, 20);
    // Buttons
    ctx.fillStyle = '#fc9838';
    ctx.fillRect(6, 28, 3, 3);
    ctx.fillRect(w - 9, 28, 3, 3);
    // Arms
    ctx.fillStyle = shirtColor;
    ctx.fillRect(0, 22, 4, 10);
    ctx.fillRect(w - 4, 22, 4, 10);
    // Hands
    ctx.fillStyle = skinColor;
    ctx.fillRect(0, 30, 4, 4);
    ctx.fillRect(w - 4, 30, 4, 4);
    // Legs (walk animation)
    const walk = Math.sin(p.walkFrame) * 3;
    ctx.fillStyle = overallColor;
    ctx.fillRect(4, 44, 6, 8);
    ctx.fillRect(w - 10, 44, 6, 8);
    // Shoes
    ctx.fillStyle = shoeColor;
    ctx.fillRect(3 + walk, 50, 8, 4);
    ctx.fillRect(w - 11 - walk, 50, 8, 4);
  } else {
    // Small Mario
    // Hat
    ctx.fillStyle = hatColor;
    ctx.fillRect(3, 0, w - 6, 6);
    ctx.fillRect(1, 4, w - 2, 4);
    // Face
    ctx.fillStyle = skinColor;
    ctx.fillRect(5, 8, w - 10, 7);
    // Eye
    ctx.fillStyle = '#000';
    ctx.fillRect(w - 9, 10, 2, 3);
    // Mustache
    ctx.fillStyle = '#3a2000';
    ctx.fillRect(w - 11, 13, 6, 2);
    // Shirt
    ctx.fillStyle = shirtColor;
    ctx.fillRect(2, 15, w - 4, 6);
    // Overalls
    ctx.fillStyle = overallColor;
    ctx.fillRect(4, 19, w - 8, 8);
    // Buttons
    ctx.fillStyle = '#fc9838';
    ctx.fillRect(6, 20, 2, 2);
    ctx.fillRect(w - 8, 20, 2, 2);
    // Legs
    const walk = Math.sin(p.walkFrame) * 2;
    ctx.fillStyle = overallColor;
    ctx.fillRect(4, 25, 5, 3);
    ctx.fillRect(w - 9, 25, 5, 3);
    // Shoes
    ctx.fillStyle = shoeColor;
    ctx.fillRect(3 + walk, 27, 7, 3);
    ctx.fillRect(w - 10 - walk, 27, 7, 3);
  }

  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fillRect(0, 0, W, 44);
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('MARIO', 20, 22);
  ctx.fillText(String(game.score).padStart(6, '0'), 20, 40);

  ctx.fillStyle = '#fc9838';
  ctx.beginPath();
  ctx.arc(280, 26, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText('×' + String(game.coins).padStart(2, '0'), 296, 40);

  ctx.textAlign = 'center';
  ctx.fillText('WORLD', W/2 - 40, 22);
  ctx.fillText('1-' + (game.level + 1), W/2 - 40, 40);

  ctx.fillText('TIME', W/2 + 60, 22);
  ctx.fillText(String(Math.max(0, Math.ceil(game.time))), W/2 + 60, 40);

  // Lives
  ctx.textAlign = 'right';
  ctx.fillText('LIVES', W - 60, 22);
  ctx.fillText('×' + game.lives, W - 20, 40);
  // Little mario icon
  drawMarioIcon(W - 90, 10);
}

function drawMarioIcon(x, y) {
  ctx.fillStyle = '#e84444';
  ctx.fillRect(x, y, 14, 5);
  ctx.fillRect(x - 2, y + 3, 18, 3);
  ctx.fillStyle = '#ffd8a8';
  ctx.fillRect(x + 2, y + 6, 10, 6);
  ctx.fillStyle = '#000';
  ctx.fillRect(x + 9, y + 8, 2, 2);
  ctx.fillStyle = '#2058c8';
  ctx.fillRect(x, y + 12, 14, 8);
  ctx.fillStyle = '#7a3800';
  ctx.fillRect(x - 1, y + 20, 6, 3);
  ctx.fillRect(x + 9, y + 20, 6, 3);
}

// ============================================================
// GAME OVER / WIN
// ============================================================
function showGameOver(won) {
  const card = document.getElementById('gameover-card');
  card.classList.toggle('win', won);
  document.getElementById('gameover-title').textContent = won ? 'YOU WIN!' : 'GAME OVER';
  document.getElementById('gameover-stats').innerHTML = `
    Score: <strong>${game.score}</strong><br>
    Coins: <strong>${game.coins}</strong><br>
    Level: <strong>${game.level + 1} / 3</strong>
  `;
  document.getElementById('gameover').classList.remove('hidden');
  if (won) {
    for (let i = 0; i < 4; i++) setTimeout(() => playSound('coin'), i * 200);
  }
}

// ============================================================
// MAIN LOOP
// ============================================================
let lastTime = 0;
function loop(t) {
  const dt = Math.min((t - lastTime) / 1000, 0.033);
  lastTime = t;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ============================================================
// BOOT
// ============================================================
document.getElementById('play-btn').onclick = () => {
  initAudio();
  newGame(0);
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('gameover').classList.add('hidden');
};

document.getElementById('restart-btn').onclick = () => {
  initAudio();
  newGame(0);
  document.getElementById('gameover').classList.add('hidden');
};

// Init game so canvas has something to draw
game = newGame(0);
game.state = 'menu';

requestAnimationFrame(loop);
</script>
